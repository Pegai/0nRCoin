[toolchain]

[features]
resolution = true
skip-lint = false

# NOT: Aşağıdaki ID gerçek değil, yalnızca base58 formatını sağlayan bir
# yer tutucu (System Program ID'si). İlk `anchor keys sync` çalıştırdığınızda
# gerçek program anahtarınızla otomatik güncellenecek; ardından bunu ve
# lib.rs içindeki declare_id!() satırını eşleştirin.
[programs.devnet]
sell_lock = "11111111111111111111111111111111111111112"

[programs.mainnet]
sell_lock = "11111111111111111111111111111111111111112"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
